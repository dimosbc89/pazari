# Tests the Tagora plugin with real WordPress + WooCommerce, sending products to a local Tagora.
name: WooCommerce plugin

on:
  push:
    paths:
      - 'plugins/woocommerce/**'
      - 'worker/plugin.ts'
      - 'worker/catalogue.ts'
      - 'sync/normalize.ts'
      - 'migrations/**'
      - '.github/workflows/woocommerce-plugin.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, intl
          tools: wp-cli

      - name: Unit test (no WordPress)
        run: php plugins/woocommerce/tests/catalog-test.php

      - name: Tagora, locally
        run: |
          npm ci
          cp .dev.vars.example .dev.vars
          npx vite build
          npx wrangler d1 migrations apply DB --local
          nohup npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:8787/gr && break; sleep 1; done
          curl -sf http://localhost:8787/api/catalogue/mode

      - name: WordPress + WooCommerce + the plugin
        run: |
          mkdir -p "$RUNNER_TEMP/wp" && cd "$RUNNER_TEMP/wp"
          wp core download --version=6.8.1 --quiet
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          wp config set TAGORA_API http://localhost:8787/api
          wp config set WP_DEBUG true --raw
          wp config set WP_DEBUG_LOG true --raw
          wp core install --url=http://localhost:8080 --title=Test --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email --quiet
          wp plugin install woocommerce --activate --quiet
          wp option update woocommerce_currency EUR
          cp -r "$GITHUB_WORKSPACE/plugins/woocommerce/tagora" wp-content/plugins/tagora
          wp plugin activate tagora
          wp plugin list --status=active

      - name: Connect, sync, approve, live updates
        env:
          WP_PATH: ${{ runner.temp }}/wp
        run: bash plugins/woocommerce/tests/integration.sh

      - name: Logs
        if: always()
        run: |
          tail -n 60 wrangler.log || true
          tail -n 60 "$RUNNER_TEMP/wp/wp-content/debug.log" 2>/dev/null || true

# Checks tagora.online every 30 minutes. If a check fails, GitHub emails the repository
# owner (Settings → Notifications → Actions). /api/health also fails when the database
# does not answer or the scheduled product sync has not run for 30 minutes.
name: Uptime

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Website loads
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 -o /dev/null https://tagora.online/gr
      - name: Database and scheduled sync are working
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 https://tagora.online/api/health

# Temporary: runs Tagora's shop check for one shop from GitHub's servers (removed afterwards).
name: Shop check
on:
  push:
    branches: [claude/tagora-rebrand]
    paths: ['shop-check/request.json']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node shop-check/check.mjs
      - name: Save the result to the branch
        if: always()
        run: |
          git config user.name "tagora-shop-check"
          git config user.email "actions@users.noreply.github.com"
          git add shop-check/out
          git commit -m "Shop check result" || exit 0
          git push

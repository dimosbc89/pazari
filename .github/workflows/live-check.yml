# Temporary: is the Shopify app configured on the live site? Removed in the next commit.
name: Live check (temporary)
on:
  push:
    branches: [claude/tagora-rebrand]
    paths: ['.github/workflows/live-check.yml']
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          sleep 120
          for i in 1 2 3 4; do
            curl -sS 'https://tagora.online/shopify?shop=test.myshopify.com&locale=el' -o page.html
            if grep -q 'name="shopify-api-key" content="5f34a1d091bb73a24ef60277139374d7"' page.html; then echo "RESULT: secret is set, the app page is ready"; exit 0; fi
            sleep 30
          done
          grep -o 'Η εφαρμογή δεν έχει ρυθμιστεί ακόμη' page.html && echo "RESULT: the Client secret (SHOPIFY_API_SECRET) is not set yet"
          curl -sS -o /dev/null -w 'webhooks %{http_code}\n' -X POST https://tagora.online/api/shopify/webhooks -d '{}'
          curl -fsS -w '\n' https://tagora.online/api/health

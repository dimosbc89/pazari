# Temporary: checks the live site after the Shopify app deploy. Removed in the next commit.
name: Live check (temporary)
on:
  push:
    branches: [claude/tagora-rebrand]
    paths: ['.github/workflows/live-check.yml']
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: New code is live (Shopify page answers; up to 10 minutes for the deploy)
        run: |
          for i in $(seq 1 40); do
            code=$(curl -sS -o page.html -w '%{http_code}' 'https://tagora.online/shopify?shop=test.myshopify.com&locale=el' || true)
            echo "try $i: $code"
            [ "$code" = "200" ] && grep -q 'Η εφαρμογή δεν έχει ρυθμιστεί ακόμη' page.html && exit 0
            sleep 15
          done
          cat page.html | head -40
          exit 1
      - name: Site, health, webhooks off until set up, existing shop still searchable
        run: |
          curl -fsS -o /dev/null -w 'gr %{http_code}\n' https://tagora.online/gr
          curl -fsS -w '\n' https://tagora.online/api/health
          curl -sS -o /dev/null -w 'webhook (expect 503 until set up) %{http_code}\n' -X POST https://tagora.online/api/shopify/webhooks -H 'Content-Type: application/json' -d '{}'
          curl -sS -D - -o /dev/null 'https://tagora.online/shopify?shop=test.myshopify.com' | grep -i '^content-security-policy'
          curl -fsS 'https://tagora.online/api/catalogue/stats?country=gr' | head -c 400; echo
          curl -fsS -o /dev/null -w 'plugin download %{http_code}\n' https://tagora.online/downloads/tagora-woocommerce.zip

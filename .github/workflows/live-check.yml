# Temporary: is the Shopify app's secret set on the live site? Removed in the next commit.
name: Live check (temporary)
on:
  push:
    branches: [claude/tagora-rebrand]
    paths: ['.github/workflows/live-check.yml']
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -sS 'https://tagora.online/shopify?shop=test.myshopify.com&locale=el' -o page.html
          if grep -q 'name="shopify-api-key" content="5f34a1d091bb73a24ef60277139374d7"' page.html; then echo "RESULT: SHOPIFY_API_SECRET is set - the app page is ready"
          else echo "RESULT: SHOPIFY_API_SECRET is NOT set"; grep -o 'Η εφαρμογή δεν έχει ρυθμιστεί ακόμη' page.html || head -c 300 page.html; fi
          echo; curl -sS -o /dev/null -w 'webhooks endpoint: %{http_code} (401 = secret set, 503 = not set)\n' -X POST https://tagora.online/api/shopify/webhooks -H 'X-Shopify-Hmac-Sha256: x' -d '{}'
          curl -fsS -w '\n' https://tagora.online/api/health
          curl -fsS -w '\n' 'https://tagora.online/api/catalogue/stats?country=gr'

# Temporary: checks the live site after the WooCommerce plugin deploy. Removed in the next commit.
name: Live check (temporary)
on:
  push:
    branches: [claude/tagora-rebrand]
    paths: ['.github/workflows/live-check.yml']
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: New code is live (plugin endpoint answers; up to 10 minutes for the deploy)
        run: |
          for i in $(seq 1 40); do
            code=$(curl -sS -o hello.json -w '%{http_code}' -X POST https://tagora.online/api/plugin/hello \
              -H 'Content-Type: application/json' -H "Authorization: Bearer tgr_$(printf '0%.0s' $(seq 1 48))" -d '{}' || true)
            echo "try $i: $code $(cat hello.json 2>/dev/null)"
            [ "$code" = "401" ] && grep -q bad_key hello.json && exit 0
            sleep 15
          done
          exit 1
      - name: Website, health, catalogue
        run: |
          curl -fsS -o /dev/null -w 'gr %{http_code}\n' https://tagora.online/gr
          curl -fsS -w '\n' https://tagora.online/api/health
          curl -fsS -w '\n' https://tagora.online/api/catalogue/mode
          curl -fsS -o /dev/null -w 'shops page %{http_code}\n' 'https://tagora.online/gr/shops?source=plugin'
      - name: Plugin download
        run: |
          curl -fsS -D headers.txt -o plugin.zip https://tagora.online/downloads/tagora-woocommerce.zip
          grep -i '^content-type' headers.txt
          ls -l plugin.zip
          unzip -l plugin.zip
          unzip -p plugin.zip tagora/tagora.php | grep -E 'Version:|TAGORA_API'

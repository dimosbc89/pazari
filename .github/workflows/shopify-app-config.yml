# Uploads plugins/shopify/shopify.app.toml to Shopify (App URL, scopes, webhooks, privacy webhooks)
# as a new version of the Tagora app, whenever it changes on main, or by hand (Actions → Run workflow).
# Needs one repository secret (Shopify CLI 5.0 reads either):
#   SHOPIFY_SERVICE_ACCOUNT_TOKEN  Shopify → Settings → Users → Security → Organization service accounts
#   SHOPIFY_APP_AUTOMATION_TOKEN   Dev Dashboard → Tagora → App settings → App Automation Token
name: Shopify app config

on:
  push:
    branches: [main]
    paths:
      - 'plugins/shopify/shopify.app.toml'
      - '.github/workflows/shopify-app-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICE_ACCOUNT: ${{ secrets.SHOPIFY_SERVICE_ACCOUNT_TOKEN }}
      APP_AUTOMATION: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload the configuration to Shopify
        working-directory: plugins/shopify
        run: |
          # Export only the token that is set: the CLI takes the first variable that exists, even if empty.
          if [ -n "$SERVICE_ACCOUNT" ]; then export SHOPIFY_SERVICE_ACCOUNT_TOKEN="$SERVICE_ACCOUNT"
          elif [ -n "$APP_AUTOMATION" ]; then export SHOPIFY_APP_AUTOMATION_TOKEN="$APP_AUTOMATION"
          else
            echo "::warning::Not uploaded: add the repository secret SHOPIFY_SERVICE_ACCOUNT_TOKEN (Shopify → Settings → Users → Security → Organization service accounts), then run this workflow again."
            exit 0
          fi
          unset SERVICE_ACCOUNT APP_AUTOMATION
          npx --yes @shopify/cli@5.0.0 app deploy --allow-updates --no-input --no-build \
            --message "Tagora ${GITHUB_SHA::7}" \
            --source-control-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"

# The Tagora app for Shopify: its configuration at Shopify.
# GitHub uploads it to Shopify as a new app version whenever it changes on main
# (.github/workflows/shopify-app-config.yml, with the secret SHOPIFY_SERVICE_ACCOUNT_TOKEN).
# By hand: `shopify app deploy` from this folder (Shopify CLI).
# Setup steps: README.md → "Tagora app for Shopify".

client_id = "5f34a1d091bb73a24ef60277139374d7"
name = "Tagora"
application_url = "https://tagora.online/shopify"
embedded = true

[access_scopes]
# Read-only: products (prices, barcodes, images, Online Store links) and stock.
scopes = "read_products,read_inventory"

[auth]
# The app uses Shopify-managed installation and token exchange, so no redirect is used;
# Shopify still needs one address here.
redirect_urls = ["https://tagora.online/shopify"]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [
    "products/create",
    "products/update",
    "products/delete",
    "inventory_levels/update",
    "app/uninstalled",
    "bulk_operations/finish",
  ]
  uri = "https://tagora.online/api/shopify/webhooks"

  # Privacy (GDPR) webhooks, required for the Shopify App Store.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://tagora.online/api/shopify/webhooks"

[pos]
embedded = false

[build]
# `shopify app dev` must never point the live app at a test tunnel.
automatically_update_urls_on_dev = false
